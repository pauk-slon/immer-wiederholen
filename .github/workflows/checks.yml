name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STUDENT_RECORD_STORAGE_URL: redis://localhost:6379/0
      FSM_STORAGE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ty check .
      - run: uv run pytest --redis-db-override="" .
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- coverage-report -->"
          body="${marker}
          ## Coverage
          $(uv run coverage report --format=markdown)"
          comment_id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" 2>/dev/null | head -1)
          if [[ "$comment_id" =~ ^[0-9]+$ ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -X PATCH --field body="${body}"
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${body}"
          fi
