name: Publish

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # YYYY.M.N: the UTC month of the commit and its number among this month's
      # commits on main. See docs/adr/0020-calendar-version-per-commit.md.
      - id: version
        env:
          TZ: UTC
        run: |
          month=$(git log -1 --format=%cd --date=format-local:%Y.%-m)
          start=$(git log -1 --format=%cd --date=format-local:%Y-%m-01T00:00:00Z)
          echo "version=$month.$(git rev-list --count --since="$start" HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          target: prod
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          # One manifest per image, without an index or attestation manifests.
          # The next step deletes untagged versions, and with an index these
          # would include the children of a tagged image.
          provenance: false
          sbom: false
      # Keeps the 10 newest images, tagged or not, so a rollback can go back
      # at most 9 commits. See docs/configuration.md.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: immer-wiederholen
          package-type: container
          min-versions-to-keep: 10
