[project]
name = "wiederholen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram[redis]~=3.29.0",
    "pydantic~=2.13.4",
    "pyyaml~=6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=wiederholen",
    "--cov-report=term-missing",
    "--fsm-storage-db-override=15",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.62",
]
