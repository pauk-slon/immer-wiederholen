[project]
name = "wiederholen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "aioboto3>=15.5.0",
    "aiogram[redis]>=3.30,<3.32",
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "litestar[standard]>=2.25.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-asgi>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic~=2.14.1",
    "pyyaml~=6.0.3",
    "typing-extensions>=4.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=wiederholen",
    "--cov-report=term-missing",
    "--redis-db-override=15",
]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.92",
    "zensical>=0.0.73",
]

[tool.uv]
# aiogram 3.31 caps pydantic below 2.14, the first release with Python 3.15 wheels.
# Remove once aiogram ships https://github.com/aiogram/aiogram/pull/1949 (#299).
override-dependencies = ["pydantic~=2.14.1"]
