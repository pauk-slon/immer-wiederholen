# Docs site config: https://zensical.org/docs/setup/basics/
# Build locally with `docker compose run --rm bot uv run --group docs zensical build --strict`.
[project]
site_name = "Immer wiederholen!"
site_description = "A Telegram bot and an embeddable web widget for practicing grammar with spaced repetition"
site_url = "https://pauk-slon.github.io/immer-wiederholen/"
repo_url = "https://github.com/pauk-slon/immer-wiederholen"
repo_name = "pauk-slon/immer-wiederholen"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Dmitry Kolyagin"

# Every page under docs/ goes here, except the individual ADRs: they're
# reached from their index, so a new ADR doesn't need a nav entry.
nav = [
  { "Home" = "index.md" },
  { "Course authors" = [
    { "Course format" = "course-format.md" },
  ] },
  { "Operators" = [
    { "Configuration" = "configuration.md" },
  ] },
  { "Contributors" = [
    { "Architecture" = "architecture.md" },
    { "Repetition schedule" = "repetition-schedule.md" },
    { "Storage and identity" = "storage.md" },
    { "Telegram bot" = "bot.md" },
    { "Web frontend" = "web-frontend.md" },
    { "AI-generated content" = "authoring.md" },
    { "Tracing" = "tracing.md" },
    { "Architecture decision records" = "adr/README.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
