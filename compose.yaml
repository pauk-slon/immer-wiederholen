services:
  bot:
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      FSM_STORAGE_URL: redis://valkey:6379/0
    volumes:
      - .:/app
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - ./.local/valkey/data:/data
