<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Immer wiederholen</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1a1a1a;
        --muted: #6b7280;
        --border: #d1d5db;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0f;
          --text: #e5e7eb;
          --muted: #9ca3af;
          --border: #3f3f46;
          --accent: #3b82f6;
        }
      }
      * { box-sizing: border-box; }
      /* Not display: flex + align-items: center on body — a flex item's
         width defaults to shrink-to-fit-content instead of a plain block
         box's "fill the container, capped by max-width", which made the
         widget (and header/footer) visibly change width between states
         (a short loading placeholder vs. a full question). margin: 0 auto
         on each of the three top-level elements instead — same fix as the
         content repo's own widget-band section already needed for the
         embedded widget. */
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        padding: 2rem 1rem;
      }
      header {
        max-width: 36rem;
        margin: 0 auto 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      german-exercise-widget {
        /* Bigger than the ~28rem/16rem default the embedded widget on a
           landing page uses — this page's whole purpose is practicing, so
           the practice card itself should be the clear focal point, not a
           small aside the way it is when embedded partway down an article.
           Overriding these two custom properties (see widget.js's own
           :host rule) is the whole mechanism; nothing else about the
           component changes. */
        --gew-max-width: 36rem;
        --gew-height: 26rem;
        margin: 0 auto;
      }
      h1 { font-size: 1.2rem; margin: 0; }
      .lang-toggle {
        display: flex;
        gap: 0.25rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.15rem;
      }
      .lang-toggle button {
        font: inherit;
        font-size: 0.85rem;
        border: none;
        background: none;
        color: var(--muted);
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        cursor: pointer;
      }
      .lang-toggle button[aria-pressed="true"] {
        background: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Immer wiederholen</h1>
      <div class="lang-toggle" role="group" aria-label="Язык">
        <button type="button" data-lang="ru">ru</button>
        <button type="button" data-lang="en">en</button>
      </div>
    </header>

    <!-- No topics attribute at all: the API treats an empty topics list as
         "the whole course", not "nothing" — see wiederholen/web/app.py's
         next_exercise(). Unlike a landing page's embedded widget, this app
         has no fixed grammar topic of its own to scope itself to. -->
    <german-exercise-widget id="widget" lang="ru"></german-exercise-widget>

    <script>
      // Runs synchronously during parsing, before the widget.js <script>
      // below is even fetched — so a saved language preference takes
      // effect on the widget's very first request, not only after the
      // learner has already toggled it once this page load. app.js (loaded
      // last) only needs to handle the toggle buttons themselves.
      (function () {
        var saved = localStorage.getItem("wiederholen-lang");
        if (saved) {
          document.getElementById("widget").setAttribute("lang", saved);
        }
      })();
    </script>
    <!-- Not the local-config.js/widget-loader.js dance the content repo's
         landing pages need — this page is served by wiederholen.web itself,
         so widget.js is always reachable at this same fixed, same-origin
         path, in every environment. -->
    <script src="/widget/widget.js"></script>
    <script src="app.js"></script>
  </body>
</html>
