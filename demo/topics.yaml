# Topic groups, in the order /topics shows them. Every topic in
# exercises.yaml belongs to exactly one group; a topic with no settings of its
# own can be left empty.
verb_forms:
  title:
    ru: Формы глаголов
    en: Verb forms
  topics:
    partizip_ii:
      # Answering partizip_ii for a word brings that word's praeteritum
      # forward in the schedule...
      chains: [praeteritum]
      # ...and unlocks its partizip_ii_meaning, which stays hidden until
      # then. A gated topic must be in the same group as its source.
      gates: [partizip_ii_meaning]
      # Shown under every question of this topic.
      instruction:
        ru: Укажи форму Partizip II
        en: Give the Partizip II form
    partizip_ii_meaning:
      instruction:
        ru: Введи пропущенное слово
        en: Enter the missing word
      # The /ai mode may rewrite this topic's questions (needs
      # ANTHROPIC_API_KEY and the ai_exercises feature flag).
      ai_generation: true
      # Questions get an illustration (needs the R2_* settings; images are
      # generated by python -m wiederholen.school.authoring.cues).
      cue_generation: true
    praeteritum:
      chains: [partizip_ii]
      instruction:
        ru: Укажи форму Präteritum
        en: Give the Präteritum form

verb_government:
  title:
    ru: Управление глаголов
    en: Verb government
  topics:
    verb_preposition:
      # Like chains, but keyed by the answer: answering "warten → auf" brings
      # forward preposition_meaning for auf, not for warten. Unlike gates,
      # chains may cross groups.
      chains_by_answer: [preposition_meaning]
      ai_generation: true

prepositions:
  title:
    ru: Предлоги
    en: Prepositions
  topics:
    preposition_meaning:
      instruction:
        ru: Введи пропущенное слово
        en: Enter the missing word
      ai_generation: true
      cue_generation: true

conjunctions:
  title:
    ru: Союзы и порядок слов
    en: Conjunctions and word order
  topics:
    nebensatzkonjunktion_meaning:
      chains: [nebensatzkonjunktion_wortstellung]
      ai_generation: true
    nebensatzkonjunktion_wortstellung:
      instruction:
        ru: Расставь слова в правильном порядке
        en: Arrange the words in the correct order
