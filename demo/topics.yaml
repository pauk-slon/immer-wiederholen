# Format reference: docs/course-format.md
#
# Topic groups, in the order /topics shows them. Every topic in
# exercises.yaml belongs to exactly one group.
#
# Topics are linked per word: answering one topic for a word affects the
# linked topics for the same word (or, with chains_by_answer, for the word
# that is the answer):
#
#   singen, trinken:
#     partizip_ii ──chains──▶ perfekt_wortstellung   brought forward
#                 └─gates───▶ partizip_ii_meaning    locked until then
#
#   warten → auf:
#     verb_preposition ──chains_by_answer──▶ preposition_meaning (for auf)

verbs:
  title:
    ru: Глаголы
    en: Verbs
  topics:
    partizip_ii:
      # Answering partizip_ii for a word brings that word's
      # perfekt_wortstellung forward in the schedule (it can come up on its
      # own too, the chain just makes it sooner)...
      chains: [perfekt_wortstellung]
      # ...and unlocks its partizip_ii_meaning, which isn't shown at all
      # until then. A gated topic must be in the same group as its source.
      gates: [partizip_ii_meaning]
      # Shown under every question of this topic.
      instruction:
        ru: Укажи форму Partizip II
        en: Give the Partizip II form
    partizip_ii_meaning:
      instruction:
        ru: Введи пропущенное слово
        en: Enter the missing word
      # The /ai mode may rewrite this topic's questions (needs
      # ANTHROPIC_API_KEY and the ai_exercises feature flag).
      ai_generation: true
      # Questions get an illustration (needs the R2_* settings; images are
      # generated by python -m wiederholen.school.authoring.cues).
      cue_generation: true
    perfekt_wortstellung:
      instruction:
        ru: Расставь слова в правильном порядке
        en: Arrange the words in the correct order

prepositions:
  title:
    ru: Предлоги
    en: Prepositions
  topics:
    verb_preposition:
      # Like chains, but keyed by the answer: answering "warten → auf" brings
      # forward preposition_meaning for auf, not for warten. Unlike gates,
      # chains may cross groups.
      chains_by_answer: [preposition_meaning]
      ai_generation: true
    preposition_meaning:
      instruction:
        ru: Введи пропущенное слово
        en: Enter the missing word
      cue_generation: true
