# A tiny demo course: one or two exercises per topic, just enough to try out
# every field an exercise can have. The schedule is keyed by (word, topic), so
# the same word appears in several topics — e.g. singen as a Partizip II form,
# a Präteritum form and a gap in a sentence.

# Typed input (no distractors), several recalls (one shown at random after a
# correct answer), one of them with a hint. grammar_classes: singen and
# trinken share the i-a-u Ablaut pattern, so once one of them is learned, the
# other's question gets a "Same as for …" hint.
- word: singen
  topic: partizip_ii
  question: singen
  answer: gesungen
  distractors: []
  grammar_classes: [i-a-u]
  explanation:
    ru: "singen — петь; Partizip II: gesungen (haben)"
    en: "singen — to sing; Partizip II: gesungen (haben)"
  recalls:
    - question: Wir haben ein Lied ___.
      answer: [Wir haben ein Lied gesungen.]
    - question: Der Chor hat laut ___.
      answer: [Der Chor hat laut gesungen.]
      hint:
        ru: der Chor — хор
        en: der Chor — choir

- word: trinken
  topic: partizip_ii
  question: trinken
  answer: getrunken
  distractors: []
  grammar_classes: [i-a-u]
  explanation:
    ru: "trinken — пить; Partizip II: getrunken (haben)"
    en: "trinken — to drink; Partizip II: getrunken (haben)"
  recalls:
    - question: Er hat einen Kaffee ___.
      answer: [Er hat einen Kaffee getrunken.]

- word: singen
  topic: praeteritum
  question: singen
  answer: sang
  distractors: []
  grammar_classes: [i-a-u]
  explanation:
    ru: "singen — петь; Präteritum: sang"
    en: "singen — to sing; Präteritum: sang"
  recalls:
    - question: Sie ___ ein Lied.
      answer: [Sie sang ein Lied.]

- word: trinken
  topic: praeteritum
  question: trinken
  answer: trank
  distractors: []
  grammar_classes: [i-a-u]
  explanation:
    ru: "trinken — пить; Präteritum: trank"
    en: "trinken — to drink; Präteritum: trank"
  recalls:
    - question: Ich ___ ein Glas Wasser.
      answer: [Ich trank ein Glas Wasser.]

# description: a translation of the sentence, shown with the question so the
# learner knows which word is meant. Topics with cue_generation in
# topics.yaml get an illustration generated from description.en.
- word: singen
  topic: partizip_ii_meaning
  question: Auf der Hochzeit hat die ganze Familie bis Mitternacht ___.
  answer: gesungen
  distractors: []
  description:
    ru: На свадьбе вся семья пела до полуночи.
    en: At the wedding, the whole family sang until midnight.
  explanation:
    ru: "singen — петь; Partizip II: gesungen (haben)"
    en: "singen — to sing; Partizip II: gesungen (haben)"

# Multiple choice: the answer is shown together with the distractors.
- word: warten
  topic: verb_preposition
  question: Wir warten schon zehn Minuten ___ den Zug.
  answer: auf
  distractors: [für, an, um]
  explanation:
    ru: warten auf + Akkusativ — ждать кого-то/что-то
    en: warten auf + Accusative — to wait for someone/something
  recalls:
    - question: Wir warten ___ (der Zug).
      answer: [Wir warten auf den Zug.]

# word is auf here: verb_preposition chains to this topic by its answer
# (chains_by_answer in topics.yaml), not by its word.
- word: auf
  topic: preposition_meaning
  question: Die Katze schläft ___ dem Sofa.
  answer: auf
  distractors: []
  description:
    ru: Кошка спит на диване.
    en: The cat is sleeping on the sofa.
  explanation:
    ru: auf + Dativ — на (где? на поверхности)
    en: auf + Dative — on (where? on a surface)

- word: weil
  topic: nebensatzkonjunktion_meaning
  question: Er trägt eine warme Jacke, ___ es draußen kalt ist.
  answer: weil
  distractors: [obwohl, damit, ob]
  explanation:
    ru: "weil (потому что) — причина: вторая часть объясняет первую."
    en: "weil (because) — a reason: the second part explains the first."

# word_bank: the answer split into chunks in the correct order; the bot shows
# them shuffled, and the web widget as tiles to arrange. Must join with spaces
# into answer.
- word: weil
  topic: nebensatzkonjunktion_wortstellung
  question: Ich gehe früh ins Bett, weil ___.
  answer: ich morgen früh aufstehen muss
  word_bank: [ich, morgen früh, aufstehen, muss]
  distractors: []
  explanation:
    ru: "weil — подчинительный союз: спрягаемый глагол уходит в конец придаточного предложения."
    en: "weil is a subordinating conjunction: the finite verb moves to the end of the clause."
